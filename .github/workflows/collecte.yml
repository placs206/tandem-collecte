name: collecte
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      seulement:
        description: "Identifiant d'une seule collectivité (vide = toutes)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python run_collecte.py --archive archive --manifeste manifeste.jsonl --duree-max 1500 ${{ inputs.seulement && format('--seulement {0}', inputs.seulement) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: archive-collecte
          path: |
            archive
            manifeste.jsonl
          retention-days: 90
      - name: Historiser le manifeste
        run: |
          git config user.name collecte-bot
          git config user.email collecte-bot@users.noreply.github.com
          git add manifeste.jsonl
          git commit -m "manifeste $(date -u +%F)" || true
          git push || true
