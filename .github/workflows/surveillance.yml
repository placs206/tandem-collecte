name: surveillance
# Veille indépendante du robot : détecte l'absence de réussite, l'absence de progression et les passages incomplets,
# ouvre une alerte (issue) et la ferme au retour à la normale. Régénère aussi RAPPORT.md (remplace l'ancien rapport.yml).
# Toutes les 6 h : chaque lancement coûte au moins 1 minute du quota GitHub ; les seuils d'alerte (12 h, 36 h) restent couverts.
on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: surveillance
  cancel-in-progress: true
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Diagnostic
        id: diag
        run: python surveillance.py --etat etat/statut.json --sortie "$GITHUB_OUTPUT"
      - name: Relancer le robot si rien ne tourne et qu'il est en retard
        if: steps.diag.outputs.relancer == 'oui'
        run: gh workflow run collecte.yml --repo ${{ github.repository }}
      - name: Ouvrir ou mettre à jour l'alerte
        if: steps.diag.outputs.alerte == 'oui'
        run: |
          gh label create alerte-robot --color B60205 --description "Anomalie du robot de collecte" 2>/dev/null || true
          titre="Robot de collecte : anomalie détectée"
          n=$(gh issue list --state open --label alerte-robot --search "$titre" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file diagnostic.md; else gh issue create --title "$titre" --body-file diagnostic.md --label alerte-robot; fi
      - name: Fermer l'alerte quand tout va bien
        if: steps.diag.outputs.alerte == 'non'
        run: |
          for n in $(gh issue list --state open --label alerte-robot --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Retour à la normale : $(cat diagnostic.md | head -3)"
          done
      - name: Rapport d'avancement (RAPPORT.md)
        if: always()
        run: |
          python rapport.py
          git config user.name collecte-bot
          git config user.email collecte-bot@users.noreply.github.com
          git add RAPPORT.md
          git commit -qm "rapport $(date -u +%FT%TZ)" || exit 0
          for essai in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null; sleep $((essai * 5))
          done
          echo "ALERTE : rapport non publié" >&2; exit 1
